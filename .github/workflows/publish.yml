name: Publish to Sonatype

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check that tag matches version in build.sbt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oP '(?<=ThisBuild / version := ")[^"]+' build.sbt)
          if [ -z "$VERSION" ]; then echo "::error::could not extract version from build.sbt"; exit 1; fi
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.sbt version $VERSION"
            exit 1
          fi

      - name: Compile
        run: sbt Test/compile

      - name: Import GPG Key
        run: |
          echo "${{ secrets.PGP_SECRET }}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Probe snapshot endpoint auth
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          if [ -z "$SONATYPE_USERNAME" ]; then echo "::error::SONATYPE_USERNAME secret is empty"; exit 1; fi
          if [ -z "$SONATYPE_PASSWORD" ]; then echo "::error::SONATYPE_PASSWORD secret is empty"; exit 1; fi
          code=$(curl -s -o /tmp/probe-resp.txt -w "%{http_code}" -X PUT --data "ci auth probe $(date -u +%s)" \
            -u "$SONATYPE_USERNAME:$SONATYPE_PASSWORD" \
            "https://central.sonatype.com/repository/maven-snapshots/me/kright/ci-auth-probe/0.0.1-SNAPSHOT/ci-auth-probe-0.0.1-SNAPSHOT.txt")
          echo "probe PUT status: $code"
          head -c 500 /tmp/probe-resp.txt || true
          case "$code" in
            2*) echo "auth OK" ;;
            *) echo "::error::snapshot endpoint rejected credentials (HTTP $code)"; exit 1 ;;
          esac

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          sbt +publishSigned

      - name: Verify snapshot landed
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          version=$(grep -oP '(?<=ThisBuild / version := ")[^"]+' build.sbt)
          if [ -z "$version" ]; then echo "::error::could not extract version from build.sbt"; exit 1; fi
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "::notice::non-snapshot version $version on branch push, skipping snapshot verification"
            exit 0
          fi
          url="https://central.sonatype.com/repository/maven-snapshots/me/kright/arrayview_3/${version}/arrayview_3-${version}.pom"
          code=$(curl -s -o /dev/null -D /tmp/headers.txt -w "%{http_code}" "$url")
          echo "pom status: $code for $url"
          grep -i "last-modified" /tmp/headers.txt || true
          if [ "$code" != "200" ]; then echo "::error::snapshot pom not found in maven-snapshots repo"; exit 1; fi

      - name: Release Bundle (only for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -o pipefail
          sbt sonatypeBundleRelease 2>&1 | tee /tmp/release.log

      - name: Show Sonatype validation errors
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          if [ ! -f /tmp/release.log ]; then echo "release step did not run, nothing to show"; exit 0; fi
          id=$(grep -oiP 'deployment id: \K[0-9a-f-]{36}' /tmp/release.log | tail -n 1 || true)
          if [ -z "$id" ]; then echo "no deployment id found in release log"; exit 0; fi
          auth=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)
          curl -s -X POST -H "Authorization: Bearer $auth" \
            "https://central.sonatype.com/api/v1/publisher/status?id=$id" -o /tmp/deployment-status.json || true
          status=$(jq -c . /tmp/deployment-status.json 2>/dev/null || tr '\n' ' ' < /tmp/deployment-status.json)
          echo "$status"
          echo "::error title=Sonatype deployment $id failed::${status:0:3500}"

      - name: Create GitHub Release (only for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
        working-directory: ${{ github.workspace }}
